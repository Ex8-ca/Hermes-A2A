name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          # Editable install pulls the runtime deps (PyYAML, cryptography) AND
          # the [dev] extras (pytest, pytest-asyncio). The pyproject.toml
          # pythonpath = ["."] setting in [tool.pytest.ini_options] lets
          # `from plugins.a2a_bridge import ...` resolve against the source
          # tree without an install, but the runtime deps must still be
          # importable for the tests to even collect.
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest plugins/a2a_bridge/tests/ -v --tb=short

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check plugins/a2a_bridge/ || true   # informational only for v0.1
